name: Development snapshot
on:
  push:
    branches: [revamp/base-app-v2]
    paths: [.github/workflows/dev-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit
      - name: Package public source and installed dependencies
        run: tar --exclude='./.git' --exclude='./.env' --exclude='./contracts/.env' -czf /tmp/seacaster-dev.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: seacaster-dev-snapshot
          path: /tmp/seacaster-dev.tgz
          retention-days: 1
