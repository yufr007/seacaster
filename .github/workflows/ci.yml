name: SeaCaster CI
on:
  push:
    branches: [main, revamp/base-app-v2]
  pull_request:
permissions:
  contents: read
jobs:
  game-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-strip-types --test tests/engine.test.ts
