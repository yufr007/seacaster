name: Revamp baseline
on:
  push:
    branches: [revamp/base-app-v2]
    paths: [.github/workflows/revamp-baseline.yml]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Baseline frontend
        continue-on-error: true
        run: |
          npm ci --ignore-scripts
          npm run build
          npx tsc --noEmit
      - name: Baseline API
        continue-on-error: true
        working-directory: backend
        run: |
          npm ci --ignore-scripts
          npm run build
