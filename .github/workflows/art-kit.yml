name: Build authored harbour art
on:
  push:
    branches: [finish/seacaster-release]
    paths: [tools/art/build.py, tools/art/premium_pass.py, tools/art/angler_pass.py, tools/art/fish_pass.py, .github/workflows/art-kit.yml]
permissions:
  contents: write
concurrency:
  group: seacaster-art-kit-release
  cancel-in-progress: true
jobs:
  author:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install authoring tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
      - name: Build original Blender assets
        run: |
          PYTHONPATH=/usr/lib/python3/dist-packages blender --background --threads 2 --python-exit-code 1 --python tools/art/build.py > /tmp/seacaster-art-build.log 2>&1
          test -s public/models/sculpted/harbour-kit.glb
      - name: Apply premium landmark pass
        run: |
          PYTHONPATH=/usr/lib/python3/dist-packages blender --background --threads 2 --python-exit-code 1 --python tools/art/premium_pass.py >> /tmp/seacaster-art-build.log 2>&1
          test -s public/models/sculpted/harbour-kit.glb
      - name: Add first-person angler pass
        run: |
          PYTHONPATH=/usr/lib/python3/dist-packages blender --background --threads 2 --python-exit-code 1 --python tools/art/angler_pass.py >> /tmp/seacaster-art-build.log 2>&1
          test -s public/models/sculpted/harbour-kit.glb
      - name: Build the complete catch catalog
        run: |
          PYTHONPATH=/usr/lib/python3/dist-packages blender --background --threads 2 --python-exit-code 1 --python tools/art/fish_pass.py >> /tmp/seacaster-art-build.log 2>&1
          test -s public/models/sculpted/harbour-kit.glb
      - name: Deduplicate without destroying named pivots
        run: |
          npx --yes --package=@gltf-transform/cli@4.2.1 gltf-transform dedup public/models/sculpted/harbour-kit.glb /tmp/harbour-kit.glb
          cp /tmp/harbour-kit.glb public/models/sculpted/harbour-kit.glb
          npx --yes --package=@gltf-transform/cli@4.2.1 gltf-transform validate public/models/sculpted/harbour-kit.glb
      - name: Verify real exported interfaces and budgets
        run: node --experimental-strip-types --test tests/art.test.ts
      - name: Commit only the generated kit on the release branch
        run: |
          test "$GITHUB_REF_NAME" = finish/seacaster-release
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)"
          git config user.name 'SeaCaster asset builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/models/sculpted/harbour-kit.glb public/models/sculpted/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'art: build premium sculpted harbour GLB kit'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Print authoring diagnostics
        if: always()
        run: tail -140 /tmp/seacaster-art-build.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seacaster-authored-art
          retention-days: 7
          path: |
            public/models/sculpted/
            /tmp/seacaster-art-source.blend
            /tmp/seacaster-art-build.log
